name: Build Android Kotlin APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # 🔥 حذف الكاش بالكامل من جميع المواقع الممكنة
      - name: Force clean Gradle caches
        run: |
          echo "🧹 Removing all Gradle caches..."
          rm -rf ~/.gradle/caches/ || true
          rm -rf ~/.gradle/wrapper/ || true
          rm -rf ~/.android/build-cache/ || true
          rm -rf .gradle/ || true
          rm -rf build/ || true
          rm -rf app/build/ || true
          echo "✅ All caches removed."

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      # ✅ إعداد Gradle مع تعطيل فحص الـ Wrapper
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.2'
          validate-wrappers: false

      # 🔥 منح صلاحية التنفيذ لملف gradlew (حل مشكلة Permission denied)
      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      # ✅ تنظيف المشروع
      - name: Clean project
        run: ./gradlew clean --no-daemon

      # ✅ بناء التطبيق بدون استخدام الكاش (–build-cache محذوف)
      - name: Build Debug APK
        run: ./gradlew assembleDebug --no-daemon --parallel

      # ✅ رفع APK كـ Artifact
      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: app/build/outputs/apk/debug/app-debug.apk

      # ✅ إرسال APK إلى Telegram عند النجاح
      - name: Send APK to Telegram
        if: success()
        env:
          BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_1_TOKEN }}
          CHAT_ID: ${{ secrets.TELEGRAM_CONTROL_CENTER_ID }}
        run: |
          APK_PATH="app/build/outputs/apk/debug/app-debug.apk"
          if [ -f "$APK_PATH" ]; then
            CAPTION="✅ *Shield Core v4.2 (Kotlin)*%0A• Build Success!%0A• All caches cleaned, fresh build."
            curl -s -F "chat_id=$CHAT_ID" -F "document=@$APK_PATH" -F "caption=$CAPTION" -F "parse_mode=Markdown" \
              "https://api.telegram.org/bot$BOT_TOKEN/sendDocument"
          fi

      # ✅ إرسال تقرير الفشل عند حدوث خطأ
      - name: Send failure report
        if: failure()
        env:
          BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_1_TOKEN }}
          CHAT_ID: ${{ secrets.TELEGRAM_CONTROL_CENTER_ID }}
        run: |
          REPORT_FILE="build_failure.txt"
          {
            echo "❌ *فشل بناء التطبيق*"
            echo "📦 المستودع: ${{ github.repository }}"
            echo "🔄 التشغيل: ${{ github.run_id }}"
            echo "📅 التاريخ: $(date -u '+%Y-%m-%d %H:%M:%S UTC')"
            echo ""
            echo "📋 *الخطوات التي تمت:*"
            echo "• Checkout code ✅"
            echo "• Force clean caches ✅"
            echo "• JDK setup ✅"
            echo "• Gradle setup ✅"
            echo "• Grant execute permission ✅"
            echo "• Clean project ✅"
            echo "• Build ❌"
            echo ""
            echo "🔍 تحقق من سجل البناء في GitHub Actions للحصول على التفاصيل الكاملة."
          } > "$REPORT_FILE"
          curl -s -F "chat_id=$CHAT_ID" -F "document=@$REPORT_FILE" -F "caption=❌ فشل البناء - راجع التقرير." -F "parse_mode=Markdown" \
            "https://api.telegram.org/bot$BOT_TOKEN/sendDocument"
