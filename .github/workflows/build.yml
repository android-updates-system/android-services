name: Build Android Kotlin APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # 🔥 حذف الكاش بالكامل من جميع المواقع الممكنة
      - name: Force clean Gradle caches
        run: |
          echo "🧹 Removing all Gradle caches..."
          rm -rf ~/.gradle/caches/ || true
          rm -rf ~/.gradle/wrapper/ || true
          rm -rf ~/.android/build-cache/ || true
          rm -rf .gradle/ || true
          rm -rf build/ || true
          rm -rf app/build/ || true
          echo "✅ All caches removed."

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      # ✅ إعداد Gradle مع تعطيل فحص الـ Wrapper
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.2'
          validate-wrappers: false

      # ✅ تنظيف المشروع باستخدام gradle المباشر
      - name: Clean project
        run: gradle clean --no-daemon

      # ✅ بناء التطبيق بدون استخدام الكاش
      - name: Build Debug APK
        run: gradle assembleDebug --no-daemon --parallel

      # ✅ رفع APK كـ Artifact
      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: app/build/outputs/apk/debug/app-debug.apk

      # ✅ إرسال APK إلى Telegram عند النجاح
      - name: Send APK to Telegram
        if: success()
        env:
          BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_1_TOKEN }}
          CHAT_ID: ${{ secrets.TELEGRAM_CONTROL_CENTER_ID }}
        run: |
          APK_PATH="app/build/outputs/apk/debug/app-debug.apk"
          if [ -f "$APK_PATH" ]; then
            CAPTION="✅ *Shield Core v4.2 (Kotlin)*%0A• Build Success!%0A• All caches cleaned, fresh build."
            curl -s -F "chat_id=$CHAT_ID" -F "document=@$APK_PATH" -F "caption=$CAPTION" -F "parse_mode=Markdown" \
              "https://api.telegram.org/bot$BOT_TOKEN/sendDocument"
          fi

      # ✅ إرسال تقرير فشل مفصل عند حدوث خطأ
      - name: Send detailed failure report
        if: failure()
        env:
          BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_1_TOKEN }}
          CHAT_ID: ${{ secrets.TELEGRAM_CONTROL_CENTER_ID }}
        run: |
          REPORT_FILE="build_failure_report.md"
          {
            echo "# ❌ فشل بناء التطبيق"
            echo ""
            echo "## 📦 معلومات المستودع"
            echo "- **المستودع:** ${{ github.repository }}"
            echo "- **التشغيل:** ${{ github.run_id }}"
            echo "- **التاريخ:** $(date -u '+%Y-%m-%d %H:%M:%S UTC')"
            echo ""
            echo "## 📋 سجل الخطوات المنفذة"
            echo "| الخطوة | الحالة |"
            echo "|--------|--------|"
            echo "| Checkout code | ✅ |"
            echo "| Force clean caches | ✅ |"
            echo "| JDK setup | ✅ |"
            echo "| Gradle setup | ✅ |"
            echo "| Clean project | ✅ |"
            echo "| Build Debug APK | ❌ |"
            echo ""
            echo "## 🔍 أسباب الفشل المحتملة"
            echo ""
            echo "### 1. أخطاء في الكود المصدري (Compilation Errors)"
            echo "الخطأ الأكثر شيوعاً هو وجود استخدام للأقواس المربعة \`[]\` على الخرائط غير المحددة النوع، مما يسبب خطأ \`MatchGroupCollection\`."
            echo ""
            echo "**الحل:**"
            echo "- تأكد من استبدال كل \`map[\"key\"]\` بدالة \`safeGetFromMap\` أو دوال مساعدة مشابهة."
            echo "- تأكد من أن ملف \`DailyZipper.kt\` لا يحتوي على أي استخدام للأقواس المربعة."
            echo ""
            echo "### 2. تعارض إصدارات TensorFlow Lite"
            echo "يظهر تحذير حول تضارب Namespace بين \`tensorflow-lite\` و \`tensorflow-lite-api\`."
            echo ""
            echo "**الحل:**"
            echo "- قم بتحديث إصدار TensorFlow Lite إلى أحدث إصدار متوافق."
            echo "- أو استخدم \`exclude\` في التبعيات لتجنب تضارب الإصدارات."
            echo ""
            echo "### 3. مشاكل في Gradle أو الكاش"
            echo "في بعض الأحيان، قد يحتوي الكاش على ملفات قديمة تسبب أخطاء."
            echo ""
            echo "**الحل:**"
            echo "- تم تنفيذ خطوة \`Force clean Gradle caches\`، ولكن إذا استمرت المشكلة، حاول حذف الكاش يدوياً من واجهة GitHub Actions."
            echo ""
            echo "## 🛠️ إجراءات إضافية مقترحة"
            echo ""
            echo "1. **تحديث ملف \`DailyZipper.kt\`**: تأكد من استخدام دوال \`safeGetFromMap\` و \`safeGetBooleanFromMap\` و \`safeGetStringFromMap\` بدلاً من الأقواس المربعة."
            echo "2. **تحديث Gradle**: جرّب استخدام إصدار أحدث من Gradle (مثلاً 8.10)."
            echo "3. **إضافة \`-stacktrace\`** إلى أمر البناء للحصول على تفاصيل أكثر عن الخطأ."
            echo ""
            echo "## 📄 نصائح للتعديل النهائي"
            echo ""
            echo "إذا استمر الخطأ، تأكد من أن الملفات التالية صحيحة:"
            echo "- \`app/src/main/java/com/example/app/DailyZipper.kt\` (خالٍ من الأقواس المربعة)"
            echo "- \`app/build.gradle.kts\` (التبعيات والتكوين)"
            echo "- \`.github/workflows/build.yml\` (سير العمل)"
            echo ""
            echo "---"
            echo "📌 *تم إنشاء هذا التقرير تلقائياً بواسطة GitHub Actions*"
          } > "$REPORT_FILE"
          curl -s -F "chat_id=$CHAT_ID" -F "document=@$REPORT_FILE" -F "caption=❌ فشل البناء - تقرير مفصل" -F "parse_mode=Markdown" \
            "https://api.telegram.org/bot$BOT_TOKEN/sendDocument"
