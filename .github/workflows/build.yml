name: Build Android Kotlin APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Force clean all caches
        run: |
          echo "🧹 Removing all caches..."
          rm -rf ~/.gradle/caches/ || true
          rm -rf ~/.gradle/wrapper/ || true
          rm -rf ~/.android/build-cache/ || true
          rm -rf .gradle/ || true
          rm -rf build/ || true
          rm -rf app/build/ || true
          echo "✅ All caches removed."

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      # ... (خطوات توليد tokens.enc كما هي) ...

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.2'
          validate-wrappers: false

      - name: Build Release APK
        run: |
          ./gradlew assembleRelease -Dorg.gradle.jvmargs="-Xmx2048m" --no-daemon

      # ====== ✅ توقيع APK باستخدام debug keystore ======
      - name: Generate debug keystore
        run: |
          keytool -genkey -v -keystore debug.keystore -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Debug, OU=Debug, O=Debug, L=Debug, ST=Debug, C=US"

      - name: Install apksigner
        run: sudo apt-get install -y apksigner

      - name: Sign APK
        run: |
          apksigner sign --ks debug.keystore --ks-pass pass:android --key-pass pass:android app/build/outputs/apk/release/app-release-unsigned.apk
          mv app/build/outputs/apk/release/app-release-unsigned.apk app/build/outputs/apk/release/app-release-signed.apk

      - name: Upload signed APK
        uses: actions/upload-artifact@v4
        with:
          name: app-release
          path: app/build/outputs/apk/release/app-release-signed.apk

      - name: Send signed APK to Telegram
        if: success()
        env:
          BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_1_TOKEN }}
          CHAT_ID: ${{ secrets.TELEGRAM_CONTROL_CENTER_ID }}
        run: |
          APK_PATH="app/build/outputs/apk/release/app-release-signed.apk"
          if [ -f "$APK_PATH" ]; then
            APK_SIZE=$(du -h "$APK_PATH" | cut -f1)
            CAPTION="✅ *Shield Core v4.2 (Kotlin)*%0A• Build Success (Release)!%0A• Signed with debug key%0A• Size: $APK_SIZE%0A• $(date -u '+%Y-%m-%d %H:%M:%S UTC')"
            curl -s -F "chat_id=$CHAT_ID" -F "document=@$APK_PATH" -F "caption=$CAPTION" -F "parse_mode=Markdown" \
              "https://api.telegram.org/bot$BOT_TOKEN/sendDocument"
          else
            echo "⚠️ Signed APK not found!"
          fi

      # ... (باقي الخطوات كتقرير فشل) ...
