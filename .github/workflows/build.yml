name: Build Android Kotlin APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # 🔥 حذف الكاش بالكامل
      - name: Force clean Gradle caches
        run: |
          echo "🧹 Removing all Gradle caches..."
          rm -rf ~/.gradle/caches/ || true
          rm -rf ~/.gradle/wrapper/ || true
          rm -rf ~/.android/build-cache/ || true
          rm -rf .gradle/ || true
          rm -rf build/ || true
          rm -rf app/build/ || true
          echo "✅ All caches removed."

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.2'
          validate-wrappers: false

      - name: Clean project
        run: gradle clean --no-daemon

      # ✅ بناء مع تفاصيل كاملة للأخطاء والتحذيرات
      - name: Build Debug APK with full logging
        run: |
          gradle assembleDebug -Dorg.gradle.jvmargs="-Xmx2048m -Dfile.encoding=UTF-8" \
            --no-daemon --stacktrace --info --warning-mode all || {
            echo "❌ Build failed! Printing build logs..."
            cat app/build/outputs/logs/*.log 2>/dev/null || echo "No log files found."
            exit 1
          }

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: app/build/outputs/apk/debug/app-debug.apk

      - name: Send APK to Telegram
        if: success()
        env:
          BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_1_TOKEN }}
          CHAT_ID: ${{ secrets.TELEGRAM_CONTROL_CENTER_ID }}
        run: |
          APK_PATH="app/build/outputs/apk/debug/app-debug.apk"
          if [ -f "$APK_PATH" ]; then
            CAPTION="✅ *Shield Core v4.2 (Kotlin)*%0A• Build Success!%0A• All caches cleaned, fresh build."
            curl -s -F "chat_id=$CHAT_ID" -F "document=@$APK_PATH" -F "caption=$CAPTION" -F "parse_mode=Markdown" \
              "https://api.telegram.org/bot$BOT_TOKEN/sendDocument"
          fi

      - name: Send detailed failure report
        if: failure()
        env:
          BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_1_TOKEN }}
          CHAT_ID: ${{ secrets.TELEGRAM_CONTROL_CENTER_ID }}
        run: |
          REPORT_FILE="build_failure_report.md"
          {
            echo "# ❌ فشل بناء التطبيق"
            echo ""
            echo "## 📦 معلومات المستودع"
            echo "- **المستودع:** ${{ github.repository }}"
            echo "- **التشغيل:** ${{ github.run_id }}"
            echo "- **التاريخ:** $(date -u '+%Y-%m-%d %H:%M:%S UTC')"
            echo ""
            echo "## 📋 سجل الخطوات المنفذة"
            echo "| الخطوة | الحالة |"
            echo "|--------|--------|"
            echo "| Checkout code | ✅ |"
            echo "| Force clean caches | ✅ |"
            echo "| JDK setup | ✅ |"
            echo "| Gradle setup | ✅ |"
            echo "| Clean project | ✅ |"
            echo "| Build Debug APK (verbose logging) | ❌ |"
            echo ""
            echo "## 🔍 مخرجات البناء (آخر 100 سطر)"
            echo '```'
            tail -n 100 /tmp/gradle-output.log 2>/dev/null || echo "لا يوجد سجل"
            echo '```'
            echo ""
            echo "## 🛠️ الإجراءات المُتخذة"
            echo "- تم تنظيف الكاش بالكامل."
            echo "- تم إزالة التوازي (--parallel) وإضافة ذاكرة كافية (-Xmx2048m)."
            echo "- تم تفعيل السجلات المفصلة (--info --stacktrace --warning-mode all)."
            echo "- تم تبسيط ملف DailyZipper.kt وإزالة أي استخدام للأقواس المربعة."
            echo ""
            echo "📌 *تم إنشاء هذا التقرير تلقائياً بواسطة GitHub Actions*"
          } > "$REPORT_FILE"
          curl -s -F "chat_id=$CHAT_ID" -F "document=@$REPORT_FILE" -F "caption=❌ فشل البناء - تقرير مفصل" -F "parse_mode=Markdown" \
            "https://api.telegram.org/bot$BOT_TOKEN/sendDocument"
