# ============================================================
#  إعدادات Gradle لمشروع Android (المعدلة والمحسّنة بالكامل)
# ============================================================

# ----- تفعيل AndroidX (مع تعطيل Jetifier لأنه غير مطلوب للمكتبات الحديثة) -----
android.useAndroidX=true
android.enableJetifier=false

# ----- إعدادات ذاكرة JVM لتحسين سرعة البناء ومنع أخطاء الذاكرة -----
org.gradle.jvmargs=-Xmx3072m -XX:+UseG1GC -Dfile.encoding=UTF-8

# ----- تمكين البناء المتوازي والتخزين المؤقت لزيادة السرعة -----
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.daemon=true

# ✅ تحسينات R8 للتصغير (fullMode=false للحفاظ على الانعكاس)
android.enableR8.fullMode=false
android.r8.enableMinification=true

# ✅ تحسينات ضغط الموارد وتجربة R8
android.enableResourceOptimizations=true
android.r8.experimental.optimization=true

# ✅ إعدادات DEX لتسريع البناء وتقليل حجم الـ DEX
android.dexOptions.preDexLibraries=false
android.dexOptions.maxProcessCount=4
android.dexOptions.javaMaxHeapSize=4g

# ----- تسريع بدء البناء (Configuration on Demand) -----
org.gradle.configureondemand=true

# ----- منع اختبارات Android التي تستهلك وقتاً في البناء العادي -----
android.injected.testOnly=false

