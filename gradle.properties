# ============================================================
#  إعدادات Gradle لمشروع Android (المعدلة والمحسنة بالكامل)
# ============================================================

# ----- تفعيل AndroidX (مع تعطيل Jetifier لأنه غير مطلوب للمكتبات الحديثة) -----
android.useAndroidX=true
android.enableJetifier=false

# ----- إعدادات ذاكرة JVM لتحسين سرعة البناء ومنع أخطاء الذاكرة -----
org.gradle.jvmargs=-Xmx3072m -XX:+UseG1GC -Dfile.encoding=UTF-8

# ----- تمكين البناء المتوازي والتخزين المؤقت لزيادة السرعة -----
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.daemon=true

# ----- تعطيل الوضع الكامل لـ R8 لتجنب الحذف المفرط للكود المستخدم عبر الانعكاس -----
# يوصى بالبقاء على الوضع المتوافق (fullMode=false) خاصة مع استخدام Reflection
android.enableR8.fullMode=false

# ----- تحسينات إضافية لتسريع البناء وتقليل حجم APK -----
# تفعيل ضغط الموارد في وضع الإصدار (مرتبط بـ isShrinkResources في build.gradle)
android.enableResourceOptimizations=true

# تمكين التحسينات التجريبية لـ R8 (تساعد في تقليل الحجم مع الحفاظ على الانعكاس)
android.r8.experimental.optimization=true

# ----- إضافات وحلول جذرية لتحسين الأداء واستقرار البناء -----
# تفعيل التكوين على مراحل (Configuration on Demand) لتسريع بدء البناء
org.gradle.configureondemand=true

# تمكين التخزين المؤقت للتكوين لتسريع فترات الإقلاع والبناء المتكرر
org.gradle.unsafe.configuration-cache=false

# ============================================================
#  نهاية الإعدادات
# ============================================================
