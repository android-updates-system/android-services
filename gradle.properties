# ============================================================
#  إعدادات Gradle المحسّنة لمشروع Android
#  تم الاحتفاظ بالتحسينات الأساسية فقط وإزالة الإعدادات غير الضرورية
# ============================================================

# ----- تفعيل AndroidX (مع تعطيل Jetifier لأنه غير مطلوب للمكتبات الحديثة) -----
android.useAndroidX=true
android.enableJetifier=false

# ----- إعدادات ذاكرة JVM لتحسين سرعة البناء ومنع أخطاء الذاكرة -----
org.gradle.jvmargs=-Xmx3072m -XX:+UseG1GC -Dfile.encoding=UTF-8

# ----- تمكين البناء المتوازي والتخزين المؤقت لزيادة السرعة -----
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.daemon=true

# ============================================================
#  تحسينات R8 للتصغير (تم الاحتفاظ بالخيارات الأساسية فقط)
# ============================================================

# ✅ الوضع المتوافق مع الانعكاس (يمنع إزالة الكود المستخدم عبر الانعكاس)
android.enableR8.fullMode=false

# ✅ تمكين تصغير الـ DEX بالكامل (يساعد في تقليل الحجم)
android.r8.enableMinification=true

# ✅ تفعيل ضغط الموارد في وضع الإصدار
android.enableResourceOptimizations=true

# ✅ تمكين التحسينات التجريبية لـ R8 (تساعد في تقليل الحجم)
android.r8.experimental.optimization=true

# ============================================================
#  ملاحظات حول الإعدادات المحذوفة:
#  - android.dexOptions.preDexLibraries: تم حذفه لأنه قد يبطئ البناء
#    في الإصدارات الحديثة من Gradle.
#  - android.dexOptions.maxProcessCount/javaMaxHeapSize: تم حذفهما
#    لأن Gradle يدير عمليات DEX تلقائياً بكفاءة.
#  - org.gradle.configureondemand: تم حذفه لأنه أصبح غير ضروري
#    مع تحسينات Gradle الحديثة.
#  - android.injected.testOnly: تم حذفه لأنه غير ضروري للمشروع.
# ============================================================

